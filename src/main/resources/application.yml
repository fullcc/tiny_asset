spring:
  application:
    name: tiny-asset
  datasource:
    url: jdbc:mysql://localhost:3306/asset_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      table-underline: true

server:
  port: 8080
